server:
  port: 8081

spring:
  application:
    name: ledger-service

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

ledger:
  seed:
    count: 10
    # Large enough to absorb a full benchmark matrix run without an account
    # depleting mid-run (combined with the harness alternating transfer
    # direction between runs for long-term stability across repeated runs).
    starting-balance: 100000000.00
