server:
  port: 8080
  tomcat:
    threads:
      max: 1000
      min-spare: 50
    accept-count: 1000

spring:
  application:
    name: account-service

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

ledger:
  service:
    base-url: http://localhost:8081
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
