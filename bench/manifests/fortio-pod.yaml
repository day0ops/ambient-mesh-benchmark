apiVersion: v1
kind: Namespace
metadata:
  name: benchmark-loadgen
---
apiVersion: v1
kind: Pod
metadata:
  name: fortio-loadgen
  namespace: benchmark-loadgen
  labels:
    app: fortio-loadgen
spec:
  nodeSelector:
    benchmark-role: loadgen
  tolerations:
    - key: benchmark-role
      operator: Equal
      value: loadgen
      effect: NoSchedule
  containers:
    - name: fortio
      image: fortio/fortio:1.63.0
      # The fortio image has no sleep/shell binary to idle on - run its own
      # server mode to keep the container alive for `kubectl exec ... fortio load`.
      command: ["fortio", "server"]
      resources:
        requests:
          cpu: "2"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "1Gi"
