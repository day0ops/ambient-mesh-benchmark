apiVersion: v1
kind: Namespace
metadata:
  name: benchmark-loadgen
---
apiVersion: v1
kind: Pod
metadata:
  name: fortio-loadgen
  namespace: benchmark-loadgen
  labels:
    app: fortio-loadgen
spec:
  nodeSelector:
    benchmark-role: loadgen
  containers:
    - name: fortio
      image: fortio/fortio:1.63.0
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "2"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "1Gi"
