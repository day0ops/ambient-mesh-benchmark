name: Release
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO_PATH: field-engineering-apac/kasunt

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - run: mvn -B -ntp verify

  tag-and-release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1); MINOR=$(echo "$VERSION" | cut -d. -f2); PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "ERROR: unknown bump_type '$BUMP_TYPE'" >&2; exit 1 ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
      - name: Push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"
      - name: Create GitHub Release
        run: gh release create "${{ steps.version.outputs.new_tag }}" --generate-notes --title "${{ steps.version.outputs.new_tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build-push:
    name: Build and push (${{ matrix.image }})
    needs: [tag-and-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: account-service
            image: account-service
          - dir: ledger-service
            image: ledger-service
    permissions:
      contents: read
      id-token: write # required for GCP Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Build and push
        env:
          NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${{ matrix.image }}:${NEW_TAG}"
          docker build -f "${{ matrix.dir }}/Dockerfile" -t "$IMAGE" .
          docker push "$IMAGE"

  create-release:
    name: Update Release with Images
    needs: [tag-and-release, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release with image locations
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
        run: |
          set -euo pipefail
          IMAGES=$(cat <<EOF
          - \`${REGISTRY}/${REPO_PATH}/account-service:${NEW_TAG}\`
          - \`${REGISTRY}/${REPO_PATH}/ledger-service:${NEW_TAG}\`
          EOF
          )
          EXISTING=$(gh release view "${NEW_TAG}" --json body -q .body)
          printf '%s\n\n## Docker Images\n\n%s\n' "$EXISTING" "$IMAGES" | gh release edit "${NEW_TAG}" --notes-file -
